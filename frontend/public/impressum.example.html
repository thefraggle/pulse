<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Notice</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0b0f19; color: #fff; line-height: 1.6; padding: 2rem; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.25rem; margin-top: 2rem; margin-bottom: 0.5rem; color: #e2e8f0; }
    p { color: #94a3b8; margin-bottom: 1rem; }
    a { color: #818cf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back { display: inline-block; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border-radius: 0.5rem; color: #94a3b8; margin-bottom: 2rem; text-decoration: none; }
    .back:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 2rem; }
  </style>
</head>
<body>
  <a href="/" class="back">&larr; Back to App</a>
  
  <div class="card">
    <h1>Legal Notice / Impressum</h1>

    <h2>Provider details</h2>
    <p>[Your Name / Company Name]<br>
    [Street Address]<br>
    [City, Zip Code]<br>
    [Country]</p>

    <h2>Contact</h2>
    <p>Email: <a href="mailto:your@email.com">your@email.com</a></p>

    <!-- Add your local legal requirements here -->
  </div>
</body>
</html>
